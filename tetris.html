<!DOCTYPE html>
<html>
<head>
  <title>Basic Tetris HTML Game</title>
  <meta charset="UTF-8">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #score {
      color: #0ff;
      font-size: 1.5em;
      font-family: 'Segoe UI', monospace;
      text-align: center;
      margin-bottom: 10px;
    }
    canvas {
      border: 1px solid white;
      box-shadow: 0 0 20px #0ff, 0 0 5px #fff;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1 style="color:#fff;font-family:'Segoe UI',sans-serif;text-align:center;margin-bottom:10px;">Tetris</h1>
  <div id="score">Score: 0</div>
  <canvas width="320" height="640" id="game"></canvas>
  <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;">
    <button id="startBtn" style="padding:8px 24px;font-size:1em;border-radius:6px;border:none;background:#222;color:#0f0;box-shadow:0 0 8px #0f0;cursor:pointer;">Start</button>
    <button id="stopBtn" style="padding:8px 24px;font-size:1em;border-radius:6px;border:none;background:#222;color:#0ff;box-shadow:0 0 8px #0ff;cursor:pointer;">Stop</button>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
